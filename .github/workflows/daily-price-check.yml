name: daily-price-check

on:
  # A cada 5 min (o mínimo que o GitHub Actions permite) -- é o "relógio"
  # de polling; scraper/scrape.py só de fato rasparmos as lojas quando a
  # altura do bloco do Bitcoin (via mempool.space) muda desde a última
  # coleta, então na prática atualiza a cada bloco novo minerado (~10 min).
  # Minuto deslocado (1,6,11...56 em vez de 0,5,10...55): o GitHub avisa
  # que o agendador atrasa/derruba execuções em horários de pico, e picos
  # de pico são justamente os minutos "redondos" (todo cron do GitHub cai
  # ali por padrão) -- rodar 1 minuto fora disso evita boa parte dessa
  # fila. Não é garantia (o agendador do GitHub continua sendo "melhor
  # esforço", sem SLA), só reduz a chance de ficar horas sem rodar.
  schedule:
    - cron: "1-56/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "site/**"
      - "!site/data/**"
      - "tests/**"
      - "tsconfig.json"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/daily-price-check.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Gate antes de raspar/publicar: se a lógica de normalize.py/
      # adapters/ quebrar (ex: uma mudança reintroduzir um bug já
      # corrigido, tipo os merges de RS15/katakana ou o filtro de tamanho
      # da Shopify), o job falha aqui -- não chega a raspar com código
      # ruim nem a publicar no Pages (o job "deploy" depende de "scrape"
      # ter terminado com sucesso).
      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run scraper
        id: scrape
        run: |
          python -m scraper.scrape
          SKIPPED=$(python3 -c "import json; print(str(json.load(open('data/last_run.json')).get('skipped', False)).lower())")
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

      - name: Aggregate + build alerts
        if: steps.scrape.outputs.skipped != 'true'
        run: python -m scraper.aggregate

      - name: Commit updated price data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "Sem bloco novo -- nada pra commitar."
            if [ "${{ github.event_name }}" = "push" ]; then
              # push real (commit em scraper/ ou site/) sempre republica o
              # site com o código novo, mesmo sem dado novo pra commitar --
              # é assim que se valida uma correção sem esperar o próximo
              # bloco (documentado no README).
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            BLOCK=$(python3 -c "import json; print(json.load(open('data/last_run.json')).get('block_height') or '?')")
            git commit -m "chore: atualiza preços de chuteiras de rugby (bloco $BLOCK)"

            # Um run de raspagem completa pode levar vários minutos (mais
            # lojas = mais tempo); se outro commit (ex: um push de código)
            # chegar em main nesse meio-tempo, o push simples é rejeitado
            # (non-fast-forward) e os dados coletados neste run se perdem
            # -- foi exatamente o que aconteceu no run do bloco 964021.
            # Tenta rebase + push algumas vezes antes de desistir.
            PUSHED=false
            for attempt in 1 2 3; do
              if git push; then
                PUSHED=true
                break
              fi
              echo "Push rejeitado (tentativa $attempt/3) -- main avançou enquanto este run raspava. Tentando rebase..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase deu conflito de verdade (não só non-fast-forward) -- descarta este commit, o próximo bloco tenta de novo."
                git rebase --abort
                break
              fi
            done

            if [ "$PUSHED" = "true" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Não consegui publicar os dados deste run (push rejeitado repetidamente) -- descartando, o próximo bloco tenta de novo."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # site/js/ não é versionado (é saída de build, ver .gitignore) --
      # compila site/src/*.ts pra lá agora, antes de publicar. O código
      # fonte de verdade é o .ts; site/js/*.js só existe durante o deploy.
      # Versão fixada na mesma usada pra validar localmente antes deste
      # commit -- evita que uma versão mais nova do TypeScript (checagem
      # mais estrita, por exemplo) quebre o deploy sem nenhuma mudança
      # de código.
      - name: Compile TypeScript
        run: npx -y -p typescript@6.0.2 tsc -p tsconfig.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
